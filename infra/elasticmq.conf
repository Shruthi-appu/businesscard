include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  image-processing {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "image-processing-dlq"
      maxReceiveCount = 3
    }
  }
  image-processing-dlq {}
  ocr-extraction {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "ocr-extraction-dlq"
      maxReceiveCount = 3
    }
  }
  ocr-extraction-dlq {}
  export {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "export-dlq"
      maxReceiveCount = 3
    }
  }
  export-dlq {}
}
